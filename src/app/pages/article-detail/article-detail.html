<div class="min-h-screen text-[var(--text-primary)] pt-20 transition-colors duration-300 relative overflow-hidden">
  <div class="absolute inset-0 bg-dots pointer-events-none"></div>

  <div class="max-w-4xl mx-auto px-4 py-12 relative">
    @if (loading()) {
      <div class="flex justify-center py-20">
        <div class="w-10 h-10 border-4 border-[var(--accent)]/30 border-t-[var(--accent)] rounded-full animate-spin"></div>
      </div>
    } @else if (article(); as a) {
      <a routerLink="/articles" class="inline-flex items-center gap-2 text-[var(--text-muted)] hover:text-[var(--accent)] transition-colors mb-8 text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Back to Articles
      </a>

      <article class="bg-[var(--bg-card)] rounded-2xl border border-[var(--border)] overflow-hidden">
        @if (a.type === 'Article' && a.image) {
          <div class="h-64 md:h-80 overflow-hidden">
            <img [src]="a.image" [alt]="a.title" class="w-full h-full object-cover" />
          </div>
        }

        <div class="p-8 md:p-10">
          <div class="flex items-center gap-2 mb-4">
            @if (a.type === 'News') {
              <span class="px-3 py-1 rounded-full text-xs font-medium bg-yellow-500/10 text-yellow-400 border border-yellow-500/20 flex items-center gap-1">
                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                News
              </span>
            } @else {
              <span class="px-3 py-1 rounded-full text-xs font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
                Article
              </span>
            }
            <span class="text-sm text-[var(--text-muted)]">{{ a.date }}</span>
          </div>

          <h1 class="text-3xl md:text-4xl font-bold mb-6">{{ a.title }}</h1>

          @if (a.url) {
            <a [href]="a.url" target="_blank" rel="noopener" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-[var(--accent)]/10 text-[var(--accent)] border border-[var(--accent)]/20 hover:bg-[var(--accent)]/20 transition-all mb-6 text-sm">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
              View Source
            </a>
          }

          <div class="prose prose-invert max-w-none text-[var(--text-secondary)] leading-relaxed whitespace-pre-wrap">
            {{ a.content }}
          </div>
        </div>
      </article>
    } @else {
      <div class="text-center py-20">
        <p class="text-[var(--text-muted)]">Article not found.</p>
        <a routerLink="/articles" class="text-[var(--accent)] hover:underline mt-4 inline-block">Back to Articles</a>
      </div>
    }
  </div>
</div>
