<div class="fixed bottom-6 right-6 z-[60] flex flex-col items-end gap-3">
  @if (bot.open()) {
    <div #chatWindow class="chatbot-window glass rounded-2xl shadow-2xl overflow-hidden w-[340px] sm:w-[380px] h-[480px] max-h-[70vh] flex flex-col transition-all duration-300 border border-[var(--border)]">
      <div class="flex items-center gap-3 px-4 py-3 border-b border-[var(--border)]" style="background: linear-gradient(135deg, var(--primary), #06b6d4)">
        <img src="avatar/jasmin.png" alt="Jasmin" class="w-8 h-8 rounded-full object-cover" />
        <div class="flex-1 min-w-0">
          <p class="text-white text-sm font-semibold">Jasmin</p>
          <p class="text-white/70 text-xs">Online • AI Assistant</p>
        </div>
        <button (click)="bot.close()" class="text-white/80 hover:text-white transition-colors p-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-4 space-y-3" #chatWindow>
        @if (bot.messages().length === 0) {
          <div class="text-center py-4">
            <div class="text-3xl mb-2">👋</div>
            <p class="text-[var(--text-muted)] text-sm">Hi! I'm Jasmin, your AI assistant.</p>
            <p class="text-[var(--text-muted)] text-xs mt-1">Ask me anything about Mohanned.</p>
            <div class="flex flex-wrap justify-center gap-2 mt-4">
              @for (q of quickQuestions; track q) {
                <button (click)="bot.sendMessage(q); inputText=''" class="px-3 py-1.5 rounded-lg text-xs font-medium border border-[var(--border)] text-[var(--text-muted)] hover:text-[var(--primary)] hover:border-[var(--primary)]/30 transition-all duration-200 bg-white/5">
                  {{ q }}
                </button>
              }
            </div>
          </div>
        }
        @for (msg of bot.messages(); track msg.createdAt) {
          <div class="flex" [class.justify-end]="msg.sender === 'user'" [class.justify-start]="msg.sender === 'bot'">
            <div class="max-w-[85%] px-3.5 py-2.5 rounded-2xl text-sm leading-relaxed" [class]="msg.sender === 'user'
              ? 'text-white rounded-br-md'
              : 'bg-white/5 text-[var(--text-primary)] rounded-bl-md'">
              {{ msg.text }}
            </div>
          </div>
        }
        @if (bot.loading()) {
          <div class="flex justify-start">
            <div class="bg-white/5 rounded-2xl rounded-bl-md px-4 py-3">
              <div class="flex gap-1.5">
                <span class="w-2 h-2 rounded-full bg-[var(--text-muted)] animate-bounce" style="animation-delay:0ms"></span>
                <span class="w-2 h-2 rounded-full bg-[var(--text-muted)] animate-bounce" style="animation-delay:150ms"></span>
                <span class="w-2 h-2 rounded-full bg-[var(--text-muted)] animate-bounce" style="animation-delay:300ms"></span>
              </div>
            </div>
          </div>
        }
      </div>

      <div class="flex items-center gap-2 px-4 py-3 border-t border-[var(--border)]">
        <input
          #inputEl
          type="text"
          [(ngModel)]="inputText"
          (keydown)="handleKeydown($event)"
          placeholder="Ask Jasmin..."
          class="flex-1 px-3 py-2 rounded-xl bg-white/5 border border-[var(--border)] text-[var(--text-primary)] text-sm placeholder-[var(--text-muted)] outline-none focus:border-[var(--primary)] transition-all duration-200"
        />
        <button (click)="send()" [disabled]="!inputText.trim()" class="p-2.5 rounded-xl text-white transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed hover:scale-105" style="background: linear-gradient(135deg, var(--primary), #06b6d4)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V5m0 0l-7 7m7-7l7 7"/></svg>
        </button>
      </div>
    </div>
  }

  <button (click)="bot.toggle()" class="chatbot-btn w-14 h-14 rounded-full shadow-xl shadow-[var(--glow-strong)] text-white flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-95 relative" style="background: linear-gradient(135deg, var(--primary), #06b6d4)">
    @if (bot.open()) {
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    } @else {
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
      <span class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-emerald-400 animate-pulse"></span>
    }
  </button>
</div>
