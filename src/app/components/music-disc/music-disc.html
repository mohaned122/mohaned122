<div class="flex flex-col items-center">
  <div class="relative" (click)="togglePlay()">
    <div class="w-72 h-72 sm:w-80 sm:h-80 rounded-full p-[3px]" [class.spinning]="playing()" style="background: conic-gradient(from 0deg, var(--primary), var(--secondary), var(--primary-light), var(--primary));">
      <div class="w-full h-full rounded-full overflow-hidden cursor-pointer">
        <img [src]="coverSrc()" alt=""
          class="w-full h-full object-cover rounded-full" />
      </div>
    </div>
    <div class="absolute inset-0 rounded-full animate-pulse-glow pointer-events-none" style="box-shadow: 0 0 60px var(--glow-strong);"></div>
    <div class="absolute bottom-2 right-2 w-10 h-10 rounded-full glass flex items-center justify-center cursor-pointer z-10 hover:scale-110 transition-transform duration-200" (click)="togglePlay(); $event.stopPropagation()">
      @if (playing()) {
        <svg class="w-5 h-5 text-[var(--primary)]" fill="currentColor" viewBox="0 0 24 24"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>
      } @else {
        <svg class="w-5 h-5 text-[var(--primary)] ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      }
    </div>
  </div>

  <div class="hidden md:flex flex-col items-center mt-6 w-full max-w-[280px]">
    <div class="waveform flex items-end justify-center gap-[3px] h-12 w-full">
      @for (bar of [].constructor(21); track $index) {
        <div class="waveform-bar" [class.active]="playing()" [style.animationDelay]="($index * 0.12) + 's'"></div>
      }
    </div>
    <span class="mt-2 text-sm text-[var(--text-muted)] text-center truncate w-full">{{ songTitle() }}</span>
  </div>
</div>
